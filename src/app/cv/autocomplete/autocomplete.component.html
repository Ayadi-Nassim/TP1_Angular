<form [formGroup]="form" class="mb-3">
  <input
    type="text"
    class="form-control"
    formControlName="search"
    placeholder="Rechercher un CV..."
  />
</form>

<div *ngIf="loading" class="text-center my-3">
  <span>Chargement...</span>
</div>

<ul *ngIf="cvs.length > 0" class="list-group">
  <li
    *ngFor="let cv of cvs"
    (click)="selectCv(cv)"
    class="list-group-item d-flex justify-content-between align-items-center"
    style="cursor: pointer"
  >
    <div>
      <h5 class="mb-0">{{ cv.firstname }} {{ cv.name }}</h5>
      <small class="text-muted">{{ cv.job }}</small>
    </div>
  </li>
</ul>

<div *ngIf="!loading && cvs.length === 0 && search.value" class="alert alert-warning mt-3">
  Aucun résultat trouvé.
</div>
